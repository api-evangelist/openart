name: Openart
description: >-
  OpenArt is an all-in-one AI creation platform for generating and editing
  images, video, audio, and 3D content from a single workspace. It aggregates
  leading generative models (Seedance, Google Veo, Sora, GPT Image, Kling and
  others) and adds tools for consistent character creation, world-building,
  motion and camera control, relighting, background replacement, and cinematic
  storytelling for creators, brands, and studios. OpenArt exposes its
  capabilities to AI agents through a hosted remote Model Context Protocol (MCP)
  server at https://mcp.openart.ai/mcp, authorized with OAuth 2.0 (PKCE +
  Dynamic Client Registration, scope full_access); it does not publish a
  conventional REST API. OpenArt was added to the API Evangelist network as a
  portfolio company of Canaan Partners and DCM Ventures.
