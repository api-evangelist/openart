notes: >-
  OpenArt publishes RFC 8414 OAuth 2.0 Authorization Server Metadata and OpenID
  Connect discovery. Both documents are identical and describe the OAuth service
  that fronts the OpenArt remote MCP server (https://mcp.openart.ai/mcp). The
  server supports authorization_code + refresh_token grants, PKCE (S256), OAuth
  Dynamic Client Registration (RFC 7591, registration_endpoint present), public
  clients (token_endpoint_auth_methods_supported: none), and a single scope,
  full_access.
